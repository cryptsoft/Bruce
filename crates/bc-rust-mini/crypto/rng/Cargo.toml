[package]
name = "bouncycastle-rng"
version.workspace = true
edition.workspace = true

[features]
default = ["std"]
# `std` brings in `getrandom` for the OS-seeded constructors
# (`HashDRBG80090A::new`, `new_from_os`, `Default::default`).
# Disable for no_std embedded targets that seed their DRBG from a
# board-local TRNG and don't want any OS-dependent code paths.
std = ["dep:getrandom"]

[dependencies]
bouncycastle-core.workspace = true
bouncycastle-sha2.workspace = true
bouncycastle-utils.workspace = true

# external
getrandom = { version = "0.4.0-rc.1", optional = true }

[dev-dependencies]
bouncycastle-core-test-framework.workspace = true
criterion.workspace = true

[[bench]]
name = "hash_drbg_benches"
harness = false
