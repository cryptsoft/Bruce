# Milestone 1 of the TrustZone-M split (see docs/TRUSTZONE.md).
#
# The SECURE image. Boots first, configures the SAU, and launches the
# Non-secure world (crates/fw-nonsecure). For M1 it exposes exactly one
# Secure-gateway veneer -- sg_led_set -- so the NS world can prove the
# boundary works by blinking the LED. Excluded from the workspace
# `members` (own linker script + CMSE link flags via build.rs), but it
# still inherits the repo-root .cargo/config.toml (target + link.x +
# cortex-m33) by directory, so no per-crate config is needed.
#
# Licensed under Apache-2.0, as is the rest of the project
# (see ../../LICENSE, ../../THIRD_PARTY.md).
[package]
name = "fw-secure"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "fw-secure"
path = "src/main.rs"

[features]
# Dev-only escape hatch (see sg_reboot_bootsel). MUST stay off for any
# image that is meant to protect the Secure world from the NS world:
# it lets NS put the chip into BOOTSEL, where flash can be rewritten.
# Default-off so that is a deliberate act, not an oversight.
dev-escape = []

# M4f: exactly one ML-DSA level, mirroring crates/firmware. The level
# fixes MLDSA_SIG_LEN, which is part of the mailbox ABI, so Secure and
# the signer must be built from the same choice.
default = ["mldsa65"]
mldsa44 = ["pqf-signer-core/mldsa44"]
mldsa65 = ["pqf-signer-core/mldsa65"]
mldsa87 = ["pqf-signer-core/mldsa87"]

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
rp235x-hal = { version = "0.4", features = ["binary-info", "critical-section-impl"] }
embedded-hal = "1.0"
panic-halt = "1.0"

# M4b/M4c: crypto that must run inside the Secure world, because the
# keys it touches are never allowed to cross the boundary. Versions
# match crates/firmware so both worlds agree bit-for-bit on credential
# derivation. no_std, no allocator -- the Secure image has no heap.
rand_core = { version = "0.6", default-features = false }
p256 = { version = "0.13", default-features = false, features = [
    "ecdsa",
    "ecdh",
    "sha256",
] }
# CTAP2 PIN protocol v1: AES-256-CBC with a zero IV over the ECDH
# shared secret. CBC is done by hand over the block cipher, as in
# crates/firmware, so no padding-mode feature is needed.
aes = { version = "0.8", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
zeroize = { version = "1.7", default-features = false }
subtle = { version = "2.5", default-features = false }

# M4f: the hybrid core-1 signer, shared verbatim with the FIDO firmware
# so both worlds run identical signing code. Pulls in ML-DSA, which
# needs an allocator -- hence embedded-alloc and the Secure heap.
pqf-signer-core = { path = "../signer-core", default-features = false }
# Same pinned path deps as signer-core: the ML-DSA public key has to be
# derived here (for the credential), which needs the seed wrapper type
# and the keygen trait.
bouncycastle-mldsa-lowmemory = { path = "../bc-rust-mini/crypto/mldsa-lowmemory", default-features = false }
bouncycastle-core-interface = { package = "bouncycastle-core", path = "../bc-rust-mini/crypto/core", default-features = false }
embedded-alloc = "0.6"

[profile.release]
opt-level = "s"
lto = true
